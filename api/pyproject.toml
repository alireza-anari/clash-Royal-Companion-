[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crc-api"
version = "0.1.0"
description = "Clash Royale Companion local-first backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "python-dotenv>=1,<2",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
security = ["PyJWT[crypto]>=2.10,<3", "asyncpg>=0.30,<1"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "PyJWT[crypto]>=2.10,<3", "asyncpg>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
