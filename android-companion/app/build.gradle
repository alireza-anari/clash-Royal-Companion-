plugins { id 'com.android.application' }
def betaBaseUrl = (project.findProperty('crcBetaBaseUrl') ?: System.getenv('CRC_BETA_BASE_URL') ?: '').toString()
def escapedBetaBaseUrl = betaBaseUrl.replace('\\', '\\\\').replace('"', '\\"')
android {
    buildFeatures { buildConfig true }
    namespace 'com.crc.companion'
    compileSdk 35
    defaultConfig {
        applicationId 'com.crc.companion'
        manifestPlaceholders = [appAuthRedirectScheme: 'com.crc.companion']
        minSdk 34
        targetSdk 35
        versionCode 1
        versionName '0.1.0-capture-alpha'
        buildConfigField 'String', 'CRC_BETA_BASE_URL', '"' + escapedBetaBaseUrl + '"'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
dependencies {
    implementation 'net.openid:appauth:0.11.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
