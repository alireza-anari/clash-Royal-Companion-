<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ورود به بتای خصوصی | Clash Royale Companion</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101722;color:#f4f6fa;font-family:system-ui,sans-serif;padding:24px}
    main{width:min(100%,420px);background:#1a2635;border:1px solid #344459;border-radius:18px;padding:28px;box-shadow:0 18px 60px #0005}
    h1{font-size:22px;margin:0 0 10px}p{color:#b7c4d4;line-height:1.8;font-size:14px}
    label{display:block;margin:22px 0 8px;font-size:14px}input{width:100%;padding:14px;border-radius:10px;border:1px solid #52647b;background:#0d1520;color:white;font:inherit;direction:ltr}
    button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:#4f83d1;color:white;font:inherit;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}#message{min-height:24px;color:#ffb9a8;margin-top:12px}
  </style>
  <script src="/beta-login.js" defer></script>
</head>
<body>
  <main>
    <h1>ورود به بتای خصوصی</h1>
    <p>این نسخه فقط برای آزمایش‌کنندگان دعوت‌شده است. کد دعوت خود را وارد کن.</p>
    <form id="invite-form">
      <label for="invite-code">کد دعوت</label>
      <input id="invite-code" name="invite_code" type="password" autocomplete="one-time-code" minlength="32" maxlength="128" required>
      <button id="submit" type="submit">ورود امن</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
