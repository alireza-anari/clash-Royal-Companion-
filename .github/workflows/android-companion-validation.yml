name: CRC Android capture validation
on:
  pull_request:
    branches: [feat/approved-visual-redesign-20261125]
    paths:
      - 'android-companion/**'
      - '.github/workflows/android-companion-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and unit-test debug app
        working-directory: android-companion
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: crc-android-debug-test
          path: |
            android-companion/app/build/outputs/apk/debug/*.apk
            android-companion/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 7
