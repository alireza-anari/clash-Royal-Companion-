name: MVP frontend tests
on:
  push:
    branches: [feat/mvp-frontend, feat/mvp-coach-offline]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check source syntax
        run: |
          node --check site/app.js
          node --check site/offline-coach.js
          node --check site/backend-client.js
          node --check site/beta-session.js
          node --check deploy/cloudflare/mvp-worker.js
          node --check deploy/cloudflare/beta-edge-worker.mjs
      - name: Verify bundle is reproducible
        run: node deploy/cloudflare/build-site.mjs --check
      - name: Run deterministic staging checks
        run: node --test site/mvp.test.mjs site/battle-insights.test.mjs site/offline-coach.test.mjs site/owned-options.test.mjs site/backend-client.test.mjs site/beta-session.test.mjs deploy/cloudflare/beta-edge.test.mjs
