# REVIEW-ONLY / DO NOT docker compose up until owner approval and readiness.
# The default profile is empty. External Docker network crc-private must already
# exist and be internal; never recreate or alter the existing PostgreSQL network.
services:
  private-beta:
    profiles: ["owner-approved-private-beta-only"]
    image: crc-private-beta:review
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.beta
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 96
    mem_limit: 256m
    restart: "no"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    env_file:
      - /etc/crc-beta/app.env
    volumes:
      # Only public CA cert. NEVER mount /var/lib/docker/volumes/... wholesale.
      - type: bind
        source: /etc/crc-beta/trust/db-ca.crt
        target: /run/crc-beta/db-ca/ca.crt
        read_only: true
      # Runtime credential is a tmpfs copy, not the root-owned 0600
      # original at /etc/crc-beta/secrets/crc-app.password. It is
      # UID 10001-owned, mode 0400, and has a root-only host parent.
      # Prepare only with deploy/aws/prepare-private-beta-secret.sh --stage.
      - type: bind
        source: /run/crc-beta/creds/crc-app.password
        target: /run/crc-beta/creds/crc-app.password
        read_only: true
    networks:
      - crc-private
    ports:
      # Publishes a beta-only TCP socket to EC2 HOST LOOPBACK, not the internet.
      - "127.0.0.1:8001:8001/tcp"

networks:
  crc-private:
    name: crc-private
    external: true
